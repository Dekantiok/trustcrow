{% extends 'base.html' %}
{% block title %}Verify Identity - Trustcrow{% endblock %}
{% block navbar %}
<nav class="navbar navbar-dark navbar-custom mb-4">
    <div class="container"><span class="navbar-brand fw-bold">Trustcrow</span></div>
</nav>
{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card card-custom shadow-sm">
            <div class="card-body p-4 text-center">
                <h4 class="text-navy fw-bold mb-3">Verify Your Identity</h4>
                <p class="text-muted small mb-4">We sent a 6-digit code to <strong class="mono-text">{{ email }}</strong></p>

                {% if error_message %}
                <div class="alert alert-danger py-2 small">{{ error_message }}</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="text" name="otp" class="form-control form-control-lg text-center mono-text" placeholder="000000" maxlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100">Verify & Continue</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
