{% extends 'base.html' %}
{% block title %}Verify OTP - Trustcrow{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <h2 class="text-navy mb-3">Verify Your Email</h2>
                <p class="text-muted mb-4">We sent a 6-digit code to <strong class="mono-text">{{ contract.creator_email }}</strong></p>
                
                {% if error_message %}
                    <div class="alert alert-danger py-2">{{ error_message }}</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="text" name="otp" class="form-control form-control-lg text-center mono-text" placeholder="000000" maxlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100">Verify & Continue</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
