{% extends 'base.html' %}
{% block title %}Create Contract - Trustcrow{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="text-navy mb-4">Initialize Escrow Contract</h2>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label fw-medium">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary-custom w-100 mt-3">Generate Contract & Send OTP</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
