{% extends 'base.html' %}
{% block title %}My Escrow — Trustcrow{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card-custom">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex align-items-center gap-2 mb-1">
                    <i class="bi bi-folder2-open text-accent fs-4"></i>
                    <span class="mono-text text-accent small fw-bold">MY ESCROW</span>
                </div>
                <h2 class="fw-bold mb-2" style="letter-spacing:-0.02em;">Access Your Escrows</h2>
                <p class="text-muted-custom small mb-4">Enter your email to view all active escrow transactions.</p>
                <div class="divider"></div>

                {% if error_message %}
                <div class="alert alert-danger border-0 py-2 small"><i class="bi bi-exclamation-circle me-1"></i>{{ error_message }}</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="your@email.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom btn-lg w-100">
                        <i class="bi bi-envelope me-2"></i>Send Verification Code
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'home' %}" class="text-muted-custom small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
