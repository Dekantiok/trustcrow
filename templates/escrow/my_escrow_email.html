{% extends 'base.html' %}
{% block title %}My Escrow - Trustcrow{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card card-custom shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-navy fw-bold mb-3">My Escrow</h3>
                <p class="text-muted small mb-4">Enter your email to view all your active escrow transactions.</p>

                {% if error_message %}
                <div class="alert alert-danger py-2 small">{{ error_message }}</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium">Email Address</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="your@email.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100">Send Verification Code</button>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'home' %}" class="text-muted small text-decoration-none">Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
