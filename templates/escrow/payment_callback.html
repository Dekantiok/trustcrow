{% extends 'base.html' %}
{% block title %}Payment Processing - Trustcrow{% endblock %}
{% block navbar %}
<nav class="navbar navbar-dark navbar-custom mb-4">
    <div class="container"><span class="navbar-brand fw-bold">Trustcrow</span></div>
</nav>
{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 text-center py-5">
        <h3 class="text-navy fw-bold">Payment Verification in Progress</h3>
        <p class="text-muted">Please wait while we confirm your transaction. Do not close this window.</p>
        <a href="{% url 'contract_detail' contract.code %}" class="btn btn-primary-custom mt-3">View Contract Status</a>
    </div>
</div>
{% endblock %}
