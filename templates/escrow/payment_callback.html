{% extends 'base.html' %}
{% block title %}Processing Payment — Trustcrow{% endblock %}
{% block navbar %}
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container"><a class="navbar-brand fw-bold fs-4" href="/">Trust<span style="color:#dc2626;">crow</span></a></div>
</nav>
{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5 text-center py-5">
        <div class="card-custom">
            <div class="card-body p-5">
                <div class="d-inline-flex align-items-center justify-content-center mb-3 rounded-circle" style="width:64px;height:64px;background:rgba(220,38,38,0.08);">
                    <i class="bi bi-hourglass-split text-accent fs-2"></i>
                </div>
                <h3 class="fw-bold mb-2">Payment Verification in Progress</h3>
                <p class="text-muted-custom small mb-4">Please wait while we confirm your transaction.</p>
                <a href="{% url 'contract_detail' contract.code %}" class="btn btn-primary-custom">
                    <i class="bi bi-arrow-right-circle me-2"></i>View Contract Status
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
