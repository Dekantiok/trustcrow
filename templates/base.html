<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trustcrow{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { background-color: #faf8ff; font-family: 'Inter', sans-serif; color: #1a1a2e; }
        .navbar-custom { background-color: #1a1a2e; }
        .btn-primary-custom { background-color: #4f8ef7; border-color: #4f8ef7; color: #fff; }
        .btn-primary-custom:hover { background-color: #3a7be0; border-color: #3a7be0; color: #fff; }
        .mono-text { font-family: 'DM Mono', monospace; }
        .text-navy { color: #1a1a2e; }
        .text-accent { color: #4f8ef7; }
        .card-custom { border: none; border-radius: 0.75rem; }
        .form-control:focus, .form-select:focus { border-color: #4f8ef7; box-shadow: 0 0 0 0.25rem rgba(79,142,247,0.25); }
    </style>
</head>
<body>
    {% block navbar %}
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Trustcrow</a>
            <div class="d-flex">
                <a href="{% url 'create_contract' %}" class="btn btn-primary-custom btn-sm">New Escrow</a>
            </div>
        </div>
    </nav>
    {% endblock %}
    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
